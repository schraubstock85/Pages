<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <meta name="color-scheme" content="light dark">
  <title>Familie Gröger</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%232f3b35'/%3E%3Ctext x='32' y='44' font-family='Georgia,serif' font-size='36' text-anchor='middle' fill='%23f4f1ea'%3EG%3C/text%3E%3C/svg%3E">
  <style>
    :root {
      --bg: #f4f1ea;
      --fg: #2f3b35;
      --muted: #7a8279;
      --line: #c9c3b6;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #1b201d;
        --fg: #ece8df;
        --muted: #8f978e;
        --line: #3a423d;
      }
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }
    body {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100svh;
      padding: 2rem;
      background: var(--bg);
      color: var(--fg);
      font-family: Georgia, "Iowan Old Style", "Palatino Linotype", Palatino, serif;
      text-align: center;
    }
    main { max-width: 36rem; }
    .monogramm {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 4.5rem;
      height: 4.5rem;
      margin-bottom: 2rem;
      border: 1px solid var(--line);
      border-radius: 50%;
      font-size: 2rem;
      letter-spacing: 0;
    }
    h1 {
      font-weight: normal;
      font-size: clamp(2.25rem, 8vw, 3.5rem);
      letter-spacing: 0.02em;
    }
    .trenner {
      width: 3rem;
      height: 1px;
      margin: 1.75rem auto;
      background: var(--line);
    }
    .eltern {
      font-size: 1.35rem;
      letter-spacing: 0.2em;
      padding-left: 0.2em;
    }
    .kinder {
      margin-top: 0.6rem;
      color: var(--muted);
      font-size: 1rem;
      letter-spacing: 0.35em;
      padding-left: 0.35em;
    }
  </style>
</head>
<body>
  <main>
    <div class="monogramm" aria-hidden="true">G</div>
    <h1>Familie Gröger</h1>
    <div class="trenner" aria-hidden="true"></div>
    <p class="eltern">A &amp; R</p>
    <p class="kinder">L · B · A · J</p>
  </main>
</body>
</html>
